<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storyboard Grid</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1 id="pageTitle">Storyboard Grid<span id="statsBar" class="stats-bar"></span></h1>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="搜索镜头（名称/内容/台词）" autocomplete="off">
            <div id="searchResults" class="search-results" style="display:none;"></div>
        </div>
        <div class="actions">
            <button id="btnCreate">Create Shot</button>
            <button id="btnTimeline">Timeline</button>
            <button id="menuBtn" class="hamburger" title="主菜单" aria-label="主菜单">
                <span class="h-line"></span><span class="h-line"></span><span class="h-line"></span>
            </button>
        </div>
    </div>

    <div id="listHeader" class="list-header">
        <span>缩略图</span><span>镜头名</span><span>时长</span><span>内容</span><span>台词</span><span style="text-align:right">更新时间</span>
    </div>

    <div id="gridWrap">
        <div id="grid" class="grid">
            <div class="empty-state">
                <p>Loading shots...</p>
            </div>
        </div>
    </div>

    <div id="contextMenu" class="context-menu" style="display:none;"></div>

    <!-- v0.9.18：右上角主菜单（三条横线）——Sync DB / Refresh 从 header 移入 -->
    <div id="mainMenu" class="context-menu main-menu" style="display:none;"></div>

    <div class="size-slider">
        <span class="slider-label">缩略图</span>
        <input type="range" id="sizeSlider" min="0" max="7" step="1" value="2">
        <span class="slider-label" id="sizeValue">200px</span>
        <button id="viewToggle" class="bar-btn">列表视图</button>
        <button id="trashBtn" class="bar-btn">垃圾桶<span id="trashCount"></span></button>
        <button id="previewBtn" class="bar-btn" title="预览框：显示选中镜头大图">预览</button>
        <button id="aspectBtn" class="bar-btn" title="画幅比/分辨率：应用到全部场景与显示">画幅</button>
        <button id="dialogueBtn" class="bar-btn" title="全局台词显示开关">台词</button>
    </div>

    <div id="statsBadge">共 <b id="statTotal">0</b> · 已选 <b id="statSel">0</b></div>

    <div id="previewPanel" class="preview-panel side-right" style="display:none;">
        <div class="preview-resize" id="previewResize" title="拖拽调整宽度"></div>
        <div class="preview-head">
            <div class="preview-head-main">
                <div class="preview-name" id="previewName">预览</div>
                <div class="preview-sub" id="previewSub"></div>
            </div>
            <div class="preview-head-btns">
                <button id="previewFlip" class="preview-flip" title="切换贴边方向">⇄ 贴到左侧</button>
                <button id="previewClose" class="preview-close" title="关闭预览框">✕</button>
            </div>
        </div>
        <div class="preview-body">
            <img id="previewImg" alt="" style="display:none;">
            <div id="previewEmpty" class="preview-empty">未选中镜头</div>
        </div>
        <div class="preview-foot" id="previewFoot">
            <div class="pf-row"><span class="pf-label">时长</span><span class="pf-val" id="pfDuration">—</span></div>
            <div class="pf-row"><span class="pf-label">内容</span><span class="pf-val" id="pfContent">—</span></div>
            <div class="pf-row"><span class="pf-label">台词</span><span class="pf-val" id="pfDialogue">—</span></div>
        </div>
    </div>

    <button id="shortcutsBtn" class="shortcuts-btn" title="查看快捷键">快捷键</button>
    <div id="shortcutsPanel" class="shortcuts-panel" style="display:none;"></div>

    <div id="createModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h2>创建镜头</h2>
            <div class="field">
                <label>镜头名</label>
                <input type="text" id="createName">
            </div>
            <div class="field">
                <label>时长（秒）</label>
                <input type="number" id="createDuration" value="2.0" step="0.1" min="0.1">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel">取消</button>
                <button class="btn-primary">创建</button>
            </div>
        </div>
    </div>

    <div id="aspectModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h2>画幅比 / 分辨率</h2>
            <div class="field">
                <label>宽（px）</label>
                <input type="number" id="aspectW" value="1920" min="16" max="16384" step="1">
            </div>
            <div class="field">
                <label>高（px）</label>
                <input type="number" id="aspectH" value="1080" min="16" max="16384" step="1">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel">取消</button>
                <button class="btn-primary">确定</button>
            </div>
        </div>
    </div>

    <div id="marqueeBox" class="marquee-box"></div>

    <div id="dropOverlay" class="drop-overlay">
        <div id="dropZoneCard" class="drop-zone">
            <div class="zone-text">拖到镜头卡片上 = 设为该镜头背景</div>
        </div>
        <div id="dropZoneNew" class="drop-zone">
            <div class="zone-text">拖到这里 = 新建图片镜头</div>
        </div>
    </div>

    <div id="confirmBar" class="confirm-bar">
        <span id="confirmText"></span>
        <button class="btn-danger" id="confirmYes">删除</button>
        <button class="btn-cancel" id="confirmNo">取消</button>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
