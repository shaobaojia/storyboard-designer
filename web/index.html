<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storyboard Grid</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1 id="pageTitle">Storyboard Grid</h1>
        <div class="actions">
            <button id="btnCreate">Create Shot</button>
            <button id="btnSync">Sync DB</button>
            <button id="btnRefresh">Refresh</button>
            <button id="btnTimeline">Timeline</button>
        </div>
    </div>

    <div id="listHeader" class="list-header">
        <span>缩略图</span><span>镜头名</span><span>时长</span><span>内容</span><span>台词</span><span style="text-align:right">更新时间</span>
    </div>

    <div id="gridWrap">
        <div id="grid" class="grid">
            <div class="empty-state">
                <p>Loading shots...</p>
            </div>
        </div>
    </div>

    <div id="contextMenu" class="context-menu" style="display:none;"></div>

    <div class="size-slider">
        <span class="slider-label">缩略图</span>
        <input type="range" id="sizeSlider" min="0" max="7" step="1" value="2">
        <span class="slider-label" id="sizeValue">200px</span>
        <button id="viewToggle" class="bar-btn">列表视图</button>
        <button id="trashBtn" class="bar-btn">垃圾桶<span id="trashCount"></span></button>
    </div>

    <div id="statsBadge">共 <b id="statTotal">0</b> · 已选 <b id="statSel">0</b></div>

    <div id="createModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h2>创建镜头</h2>
            <div class="field">
                <label>镜头名</label>
                <input type="text" id="createName">
            </div>
            <div class="field">
                <label>时长（秒）</label>
                <input type="number" id="createDuration" value="2.0" step="0.1" min="0.1">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel">取消</button>
                <button class="btn-primary">创建</button>
            </div>
        </div>
    </div>

    <div id="marqueeBox" class="marquee-box"></div>

    <div id="dropOverlay" class="drop-overlay">
        <div id="dropZoneCard" class="drop-zone">
            <div class="zone-text">拖到镜头卡片上 = 设为该镜头背景</div>
        </div>
        <div id="dropZoneNew" class="drop-zone">
            <div class="zone-text">拖到这里 = 新建图片镜头</div>
        </div>
    </div>

    <div id="confirmBar" class="confirm-bar">
        <span id="confirmText"></span>
        <button class="btn-danger" id="confirmYes">删除</button>
        <button class="btn-cancel" id="confirmNo">取消</button>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
